<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commission Quote App</title>
    <style>
      /* One small column, centered horizontally and anchored to the top. The
         grid is on body because #root sits between body and main. Centering
         vertically too would shift the whole column — the button included —
         every time the result or error message changes its height. */
      body {
        min-height: 100vh;
        display: grid;
        justify-items: center;
        align-items: start;
        padding-block-start: 4rem;
      }
      #root {
        width: 100%;
      }
      main {
        max-width: 30rem;
        margin-inline: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
